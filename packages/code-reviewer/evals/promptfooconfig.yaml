description: Code reviewer model comparison — haiku-4-5 vs sonnet-4-6 vs opus-4-8

x-reviewer-config: &reviewer-config
  system: |
    You are a precise, constructive code reviewer evaluating a pull request.
    Score the diff on five criteria on a scale of 1-10 (1 = critical issues, 10 = exemplary):
    implementation correctness, idiomaticity, complexity, test coverage relative to risk, security.
    Then issue a binding verdict (pass/fail) for the entire change and include a short summary (2-3 sentences)
    in Markdown that gives the PR author clear, actionable next steps.
  output_format:
    type: json_schema
    schema:
      $schema: "http://json-schema.org/draft-07/schema#"
      type: object
      properties:
        implementationCorrectness:
          type: number
          description: "Implementation correctness: does the code do what it claims (scale 1-10)"
        idiomaticity:
          type: number
          description: "Idiomaticity: alignment with language and project conventions (scale 1-10)"
        complexity:
          type: number
          description: "Complexity: simplicity of the solution relative to the problem (scale 1-10)"
        testRiskCoverage:
          type: number
          description: "Test coverage proportional to the risk of changed code paths (scale 1-10)"
        securitySafety:
          type: number
          description: "Security: absence of vulnerabilities and secret leaks (scale 1-10)"
        verdict:
          type: string
          enum: [pass, fail]
          description: "Binding verdict for the entire change"
        summary:
          type: string
          description: "Markdown summary ready to post as a PR comment"
      required:
        - implementationCorrectness
        - idiomaticity
        - complexity
        - testRiskCoverage
        - securitySafety
        - verdict
        - summary
      additionalProperties: false
  maxTurns: 2

defaultTest:
  options:
    provider: anthropic:messages:claude-haiku-4-5-20251001

providers:
  - id: anthropic:claude-agent-sdk
    label: haiku-4-5
    config:
      <<: *reviewer-config
      model: claude-haiku-4-5-20251001
      maxBudgetUsd: 0.05

  - id: anthropic:claude-agent-sdk
    label: sonnet-4-6
    config:
      <<: *reviewer-config
      model: claude-sonnet-4-6
      maxBudgetUsd: 0.05

  - id: anthropic:claude-agent-sdk
    label: opus-4-8
    config:
      <<: *reviewer-config
      model: claude-opus-4-8
      maxBudgetUsd: 0.20

prompts:
  - "Review this pull request:\n\n{{diff}}"

tests:
  - vars:
      diff: file://diffs/complex-migration.diff
    assert:
      - type: is-json

      - type: javascript
        value: |
          const d = typeof output === 'string' ? JSON.parse(output) : output;
          return ['implementationCorrectness','idiomaticity','complexity',
                  'testRiskCoverage','securitySafety']
            .every(k => typeof d[k] === 'number' && d[k] >= 1 && d[k] <= 10);

      - type: javascript
        value: |
          const d = typeof output === 'string' ? JSON.parse(output) : output;
          return d.verdict === 'fail';

      - type: llm-rubric
        value: |
          The code review must identify at least two of these three bugs:
          1. NOT NULL column added to 'npcs' without a DEFAULT — will error on any non-empty table
          2. RLS enabled on 'encounter_sessions' but no policies defined — table is inaccessible to all users
          3. 'session_npcs.npc_id' references 'characters(id)' instead of 'npcs(id)' — wrong FK target
          Return pass only if the review summary explicitly names at least two of the issues above.
