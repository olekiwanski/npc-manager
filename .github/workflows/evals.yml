name: Code Review Evals
on:
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/code-reviewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
